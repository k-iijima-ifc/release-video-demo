name: check-env

# Secrets / Variables を登録したら手動で実行し、各APIに疎通できるか確かめる
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:env
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BACKLOG_API_KEY: ${{ secrets.BACKLOG_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PIXELLAB_API_KEY: ${{ secrets.PIXELLAB_API_KEY }}
          RUNWAYML_API_SECRET: ${{ secrets.RUNWAYML_API_SECRET }}
          BACKLOG_DOMAIN: ${{ vars.BACKLOG_DOMAIN }}
          BACKLOG_PROJECT_KEY: ${{ vars.BACKLOG_PROJECT_KEY }}
          BACKLOG_DONE_STATUS_ID: ${{ vars.BACKLOG_DONE_STATUS_ID }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL_ID: ${{ vars.ELEVENLABS_MODEL_ID }}
